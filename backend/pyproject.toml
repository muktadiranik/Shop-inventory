[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "small-shop-inventory"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "strawberry-graphql[fastapi]==0.339.1",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
browser = ["playwright>=1.58,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
